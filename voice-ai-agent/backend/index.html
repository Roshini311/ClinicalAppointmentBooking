<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Voice AI - Clinical Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: #f8fafc; 
            margin: 0; padding: 2rem; 
            height: 100vh;
            display: flex; flex-direction: column; 
            box-sizing: border-box;
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;}
        h1 { margin: 0; font-weight: 800; font-size: 1.8rem; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; color: transparent;}
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 1.5rem;
            flex: 1;
            overflow: hidden;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-title { font-size: 0.9rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;}
        
        .chat-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1rem; scrollbar-width: thin; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.4; font-size: 0.95rem; animation: fadeIn 0.3s ease-out; }
        .user-msg { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); align-self: flex-end; color: #e0f2fe; }
        .system-msg { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); align-self: flex-start; color: #d1fae5; }
        .outbound-msg { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); align-self: center; text-align: center; width: 80%; color: #fef3c7; }
        
        .controls { display: flex; gap: 10px; align-items: center;}
        input[type="text"] { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid var(--glass-border); outline: none; background: rgba(0,0,0,0.2); color: white; font-family: 'Inter', sans-serif; font-size: 0.95rem; }
        button { padding: 14px 20px; font-family: 'Inter', sans-serif; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; border: none; display: flex; align-items: center; gap: 8px;}
        
        .btn-mic { background: var(--primary); color: #0f172a; }
        .btn-mic:hover { background: #7dd3fc; transform: translateY(-1px); }
        .btn-outbound { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outbound:hover { background: rgba(56, 189, 248, 0.1); }

        .log-box { display: flex; flex-direction: column; gap: 0.8rem; overflow-y: auto; flex: 1; padding-right: 5px; scrollbar-width: thin; }
        .log-item { background: rgba(0,0,0,0.3); border-left: 3px solid #64748b; padding: 10px; border-radius: 4px 8px 8px 4px; font-family: monospace; font-size: 0.8rem; color: #cbd5e1; }
        .log-tool { border-left-color: var(--primary); }
        .log-memory { border-left-color: var(--warning); }
        .log-json { border-left-color: #a855f7; background: rgba(168, 85, 247, 0.05); }

        .latency-bar { display: flex; justify-content: space-between; font-family: monospace; font-size: 0.85rem; color: #10b981; margin-top: 10px; padding: 10px; background: rgba(16, 185, 129, 0.1); border-radius: 6px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Voice AI Agent</h1>
        <div style="display: flex; gap: 15px; align-items: center;">
            <span id="langIndicator" style="font-size: 0.85rem; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 20px;">🌐 Language: Auto</span>
            <button class="btn-outbound" onclick="triggerOutbound()">📞 Simulate Outbound Call</button>
        </div>
    </div>

    <div class="grid">
        <!-- Main Chat Panel -->
        <div class="glass-panel">
            <div class="panel-title">Conversation Stream</div>
            <div class="chat-area" id="chat">
                <div class="msg system-msg">WebSocket active. Ready for Real-Time Audio pipeline.</div>
            </div>
            
            <div class="latency-bar" id="latencyBar" style="display: none;"></div>

            <div class="controls" style="margin-top: 1rem;">
                <input type="text" id="userInput" placeholder="Test with: 'Book dentist at 10 AM tomorrow' or 'मुझे कल डॉक्टर से मिलना है'" onkeypress="handleKey(event)">
                <button class="btn-mic" onclick="sendMsg()">🎤 Send Flow</button>
            </div>
        </div>

        <!-- Orchestration Logs Panel -->
        <div class="glass-panel" style="background: rgba(15, 23, 42, 0.8);">
            <div class="panel-title">AI Orchestration & Logs</div>
            <div class="log-box" id="logs">
                <div class="log-item">System: Using Lightweight Deterministic Intent Parser to guarantee SLA.</div>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://" + window.location.host + "/ws/clinical-demo-99");
        const chat = document.getElementById('chat');
        const logs = document.getElementById('logs');
        const input = document.getElementById('userInput');
        const latBar = document.getElementById('latencyBar');

        ws.onmessage = function(event) {
            if (event.data instanceof Blob) return; 
            
            try {
                const packet = JSON.parse(event.data);
                
                if (packet.type === "debug_latency") {
                    addChat(`Agent: ${packet.summary.Text}`, 'system-msg');
                    latBar.style.display = 'flex';
                    latBar.innerHTML = `
                        <span>Pipeline SLA: ${packet.summary.total_latency}</span>
                        <span style="color:#94a3b8">Intent: ${packet.summary.IntentParser || packet.summary.LLM_Reasoning}</span>
                    `;
                } 
                else if (packet.type === "outbound_log") {
                    addChat(packet.message, 'outbound-msg');
                }
                else if (packet.type === "language_detected") {
                    document.getElementById('langIndicator').innerText = `🌐 Detected: ${packet.language}`;
                }
                else if (packet.type === "reasoning_trace") {
                    addLog('🧩 Reasoning Trace', JSON.stringify(packet.data, null, 2), 'log-json');
                }
                else if (packet.type === "tool_log") {
                    addLog('🔧 Tool Executed', JSON.stringify(packet.data, null, 2), 'log-tool');
                }
                else if (packet.type === "memory_log") {
                    addLog('🧠 Context Memory', JSON.stringify(packet.data, null, 2), 'log-memory');
                }
            } catch (e) { console.error("Error parsing WS message", e); }
        };

        function handleKey(e) { if (e.key === 'Enter') sendMsg(); }

        function sendMsg() {
            if(!input.value.trim()) return;
            addChat(`You: ${input.value}`, 'user-msg');
            ws.send(new TextEncoder().encode(input.value));
            input.value = '';
        }

        function triggerOutbound() {
            addChat("Initiating background outbound queue...", 'system-msg');
            ws.send(new TextEncoder().encode("TRIGGER_OUTBOUND"));
        }

        function addChat(text, cls) {
            const div = document.createElement('div');
            div.className = `msg ${cls}`;
            div.innerHTML = text.replace(/\n/g, '<br>');
            chat.appendChild(div);
            setTimeout(() => chat.scrollTop = chat.scrollHeight, 10);
        }

        function addLog(title, jsonStr, cls) {
            const div = document.createElement('div');
            div.className = `log-item ${cls}`;
            div.innerHTML = `<strong style="color:white; display:block; margin-bottom:5px;">${title}</strong><pre style="margin:0; white-space:pre-wrap;">${jsonStr}</pre>`;
            logs.appendChild(div);
            setTimeout(() => logs.scrollTop = logs.scrollHeight, 10);
        }
    </script>
</body>
</html>
